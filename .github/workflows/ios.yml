name: Amethyst iOS Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test catalog and version assessments
        run: |
          swiftc Amethyst/Catalog.swift Tests/main.swift -o "$RUNNER_TEMP/amethyst-tests"
          "$RUNNER_TEMP/amethyst-tests"
      - name: Compile, package and validate device IPA
        run: Scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Amethyst-unsigned
          path: build/Amethyst.ipa
          if-no-files-found: error
