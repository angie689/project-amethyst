name: Amethyst iOS Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Test assessments, import formats and native probes
        run: Scripts/test.sh
      - name: Compile, package and validate device IPA
        run: Scripts/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Amethyst-unsigned
          path: build/Amethyst.ipa
          if-no-files-found: error
